<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tony's Kitchen - Food Cost</title>
    <script>
      // Redirect GitHub Pages 404 back to the main app
      var l = window.location;
      var repoSegments = l.pathname.split('/').filter(Boolean);
      var basePath = repoSegments.length > 0 ? '/' + repoSegments[0] + '/' : '/';
      window.location.replace(basePath + (l.search || '') + (l.hash || ''));
    </script>
  </head>
  <body>
    <p>Redirecting to Tony's Kitchen...</p>
  </body>
</html>
